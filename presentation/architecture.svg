<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="780" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="45" fill="#f1f5f9" font-size="26" font-weight="bold" text-anchor="middle">
    PyDB — Architecture
  </text>
  <text x="450" y="72" fill="#94a3b8" font-size="14" text-anchor="middle">
    A relational database engine written from scratch in Python
  </text>

  <!-- SQL text input -->
  <rect x="330" y="100" width="240" height="46" rx="8" fill="#334155" filter="url(#shadow)"/>
  <text x="450" y="129" fill="#f1f5f9" font-size="15" text-anchor="middle">
    "SELECT * FROM users WHERE age &gt; 26;"
  </text>

  <line x1="450" y1="146" x2="450" y2="172" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Frontend Layer -->
  <rect x="80" y="175" width="740" height="115" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="200" fill="#60a5fa" font-size="13" font-weight="bold">FRONTEND LAYER</text>

  <rect x="110" y="215" width="200" height="58" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="210" y="240" fill="white" font-size="14" font-weight="bold" text-anchor="middle">tokenizer.py</text>
  <text x="210" y="260" fill="#dbeafe" font-size="11" text-anchor="middle">SQL → tokens</text>

  <rect x="350" y="215" width="200" height="58" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="450" y="240" fill="white" font-size="14" font-weight="bold" text-anchor="middle">parser.py</text>
  <text x="450" y="260" fill="#dbeafe" font-size="11" text-anchor="middle">tokens → AST</text>

  <rect x="590" y="215" width="200" height="58" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="690" y="240" fill="white" font-size="14" font-weight="bold" text-anchor="middle">ast_nodes.py</text>
  <text x="690" y="260" fill="#dbeafe" font-size="11" text-anchor="middle">statement shapes</text>

  <line x1="310" y1="244" x2="345" y2="244" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="244" x2="585" y2="244" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="450" y1="290" x2="450" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Execution Layer -->
  <rect x="80" y="325" width="740" height="115" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="100" y="350" fill="#c084fc" font-size="13" font-weight="bold">EXECUTION LAYER</text>

  <rect x="110" y="365" width="210" height="58" rx="8" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="215" y="390" fill="white" font-size="14" font-weight="bold" text-anchor="middle">executor.py</text>
  <text x="215" y="410" fill="#ede9fe" font-size="11" text-anchor="middle">walks the AST</text>

  <rect x="345" y="365" width="210" height="58" rx="8" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="450" y="390" fill="white" font-size="14" font-weight="bold" text-anchor="middle">catalog.py</text>
  <text x="450" y="410" fill="#ede9fe" font-size="11" text-anchor="middle">table schemas</text>

  <rect x="580" y="365" width="210" height="58" rx="8" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <text x="685" y="390" fill="white" font-size="14" font-weight="bold" text-anchor="middle">constraints</text>
  <text x="685" y="410" fill="#ede9fe" font-size="11" text-anchor="middle">PK · NOT NULL · types</text>

  <line x1="320" y1="394" x2="340" y2="394" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="555" y1="394" x2="575" y2="394" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="450" y1="440" x2="450" y2="470" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Storage Layer -->
  <rect x="80" y="475" width="740" height="175" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="100" y="500" fill="#34d399" font-size="13" font-weight="bold">STORAGE LAYER</text>

  <rect x="110" y="515" width="220" height="58" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="220" y="540" fill="white" font-size="14" font-weight="bold" text-anchor="middle">heap.py</text>
  <text x="220" y="560" fill="#d1fae5" font-size="11" text-anchor="middle">chain of pages per table</text>

  <rect x="350" y="515" width="220" height="58" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="460" y="540" fill="white" font-size="14" font-weight="bold" text-anchor="middle">slotted.py</text>
  <text x="460" y="560" fill="#d1fae5" font-size="11" text-anchor="middle">rows inside 4 KB pages</text>

  <rect x="590" y="515" width="200" height="58" rx="8" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="690" y="540" fill="white" font-size="14" font-weight="bold" text-anchor="middle">pager.py</text>
  <text x="690" y="560" fill="#d1fae5" font-size="11" text-anchor="middle">LRU cache + file I/O</text>

  <line x1="330" y1="544" x2="345" y2="544" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="544" x2="585" y2="544" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="595" width="500" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="450" y="622" fill="#94a3b8" font-size="12" text-anchor="middle" font-style="italic">
    Only pager.py touches the filesystem — everything above is pure logic
  </text>

  <!-- Disk -->
  <line x1="450" y1="650" x2="450" y2="680" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="685" width="170" height="50" rx="8" fill="url(#amberGrad)" filter="url(#shadow)"/>
  <text x="345" y="708" fill="white" font-size="14" font-weight="bold" text-anchor="middle">data.db</text>
  <text x="345" y="725" fill="#fef3c7" font-size="10" text-anchor="middle">4 KB pages, raw bytes</text>

  <rect x="470" y="685" width="170" height="50" rx="8" fill="url(#amberGrad)" filter="url(#shadow)"/>
  <text x="555" y="708" fill="white" font-size="14" font-weight="bold" text-anchor="middle">catalog.json</text>
  <text x="555" y="725" fill="#fef3c7" font-size="10" text-anchor="middle">table schemas</text>

  <text x="450" y="765" fill="#64748b" font-size="11" text-anchor="middle">
    ~2,500 lines of pure Python · no third-party dependencies
  </text>
</svg>